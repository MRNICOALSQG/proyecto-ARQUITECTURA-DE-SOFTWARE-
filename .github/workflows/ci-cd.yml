name: Rin'ne CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una sola ejecucion por PR o por rama: los pushes consecutivos cancelan la
# ejecucion anterior en lugar de acumular runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rinne_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rinne_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rinne_test_ci
      # Falla si PostgreSQL no esta disponible en lugar de omitir en silencio
      # las pruebas de integracion.
      REQUIRE_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        working-directory: backend
        run: pnpm typecheck

      - name: Build backend (canonical, with declarations)
        working-directory: backend
        run: pnpm build

      - name: Run backend tests with coverage
        working-directory: backend
        run: pnpm test:coverage

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  image-scan:
    name: Build and scan container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Necesario para subir SARIF. En PRs desde forks GitHub lo degrada a
      # lectura y la carga se omite; el escaneo con exit-code 1 sigue bloqueando.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          load: true
          tags: rinne-api:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          load: true
          tags: rinne-web:${{ github.sha }}

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rinne-api:${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rinne-web:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      # `always()` conserva el reporte cuando el escaneo bloquea el job. La
      # condicion de repositorio evita fallos en PRs desde forks, donde el token
      # no puede tener security-events: write.
      - name: Upload API Trivy SARIF
        if: always() && hashFiles('trivy-api.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload web Trivy SARIF
        if: always() && hashFiles('trivy-web.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

  publish-ghcr:
    name: Publish images to GHCR
    # Solo main publica: las ramas y los PRs nunca escriben en el registro.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image-scan ya valido el mismo commit con Trivy HIGH,CRITICAL antes de
      # llegar aqui. Se publica la imagen con la etiqueta inmutable del SHA.
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--api:${{ github.sha }}
            ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--api:latest
          build-args: APP_VERSION=${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--web:${{ github.sha }}
            ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--web:latest
