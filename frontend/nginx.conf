server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Songs can be up to 50 MB; leave headroom for multipart overhead.
    client_max_body_size 60m;

    # Docker's embedded DNS. Using a variable in proxy_pass (below) forces Nginx
    # to re-resolve `api` every `valid` seconds instead of caching its IP at
    # startup, so recreating the API container does not leave the web tier
    # pointing at an old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API. No trailing slash on proxy_pass so the /api/ prefix reaches Express
    # unchanged (the backend mounts its routes under /api).
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Uploaded assets. Same rule: preserve the /uploads/ prefix.
    location /uploads/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # React SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
