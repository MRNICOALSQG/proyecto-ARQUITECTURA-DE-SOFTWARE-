# Rin'ne - configuracion de produccion con Docker Compose.
# Uso: TAG=<version> docker compose -f compose.prod.yml pull
#      TAG=<version> docker compose -f compose.prod.yml up -d
#
# Requiere que el pipeline publique las imagenes en GHCR:
#   ghcr.io/mrnicolasqg/proyecto-arquitectura-de-software--api:<TAG>
#   ghcr.io/mrnicolasqg/proyecto-arquitectura-de-software--web:<TAG>
#
# No hay secretos embebidos: todos los valores sensibles salen de .env.
# El proyecto `rinne` y los volumenes son los mismos que en compose.yml.

name: rinne

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rinne}
      POSTGRES_USER: ${POSTGRES_USER:-rinne_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/mrnicolasqg/proyecto-arquitectura-de-software--api:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-rinne_user}:${DB_PASSWORD:?DB_PASSWORD es obligatoria}@db:5432/${POSTGRES_DB:-rinne}
      UPLOAD_DIR: /data/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/mrnicolasqg/proyecto-arquitectura-de-software--web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
