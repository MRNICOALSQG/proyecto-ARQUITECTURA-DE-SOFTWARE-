# Rin'ne - configuracion de produccion con Docker Compose.
# Uso: TAG=<version> docker compose -f compose.prod.yml pull
#      TAG=<version> docker compose -f compose.prod.yml up -d
#
# TAG es obligatoria: sin ella, Compose falla en lugar de desplegar `latest`.
# Requiere que el pipeline publique las imagenes en GHCR:
#   ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--api:<TAG>
#   ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--web:<TAG>
#
# No hay secretos embebidos: todos los valores sensibles salen de .env.
# El proyecto `rinne` y los volumenes son los mismos que en compose.yml.

name: rinne

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rinne}
      POSTGRES_USER: ${POSTGRES_USER:-rinne_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria y debe ser URL-safe (solo A-Za-z0-9._~-)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # El esquema lo aplica el servicio `migrate`, no init.sql.
    healthcheck:
      # DB_PASSWORD se inserta tal cual en DATABASE_URL; si no es URL-safe, el
      # parser de la API decodifica caracteres y la autenticacion falla. Marca
      # la base como no saludable para detectarlo antes de arrancar la API.
      test: ["CMD-SHELL", "printf '%s' \"$$POSTGRES_PASSWORD\" | grep -Eq '^[A-Za-z0-9._~-]+$$' || { echo 'DB_PASSWORD debe ser URL-safe: solo A-Za-z0-9._~-' >&2; exit 1; }; pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    # TAG debe corresponder a una imagen de API construida desde un commit que
    # incluya dist/migrations/cli.js (Cambio 10). Una imagen anterior no sirve.
    image: ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--api:${TAG:?TAG es obligatoria}
    # Servicio one-shot: aplica las migraciones pendientes y termina.
    restart: "no"
    command:
      - sh
      - -c
      - >-
        test -f dist/migrations/cli.js ||
        { echo 'La imagen no contiene dist/migrations/cli.js; usa un TAG construido desde el Cambio 10.' >&2; exit 1; };
        exec node dist/migrations/cli.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rinne_user}:${DB_PASSWORD:?DB_PASSWORD es obligatoria y debe ser URL-safe (solo A-Za-z0-9._~-)}@db:5432/${POSTGRES_DB:-rinne}
      MIGRATIONS_DIR: /app/database/migrations
    volumes:
      # El checkout de produccion debe incluir database/migrations/.
      - ./database/migrations:/app/database/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--api:${TAG:?TAG es obligatoria}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # DB_PASSWORD debe ser URL-safe para que PostgreSQL y el parser de la API
      # reciban exactamente la misma contrasena (sin percent-encoding manual).
      DATABASE_URL: postgresql://${POSTGRES_USER:-rinne_user}:${DB_PASSWORD:?DB_PASSWORD es obligatoria y debe ser URL-safe (solo A-Za-z0-9._~-)}@db:5432/${POSTGRES_DB:-rinne}
      UPLOAD_DIR: /data/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/mrnicoalsqg/proyecto-arquitectura-de-software--web:${TAG:?TAG es obligatoria}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
